# `docker compose up` → dev server at http://localhost:4321/EngineeringHandbook/
#
# Host port defaults to 4321 (the same port .claude/launch.json uses) rather
# than Docusaurus's 3000, which tends to be occupied. Override with
# HANDBOOK_PORT=8080 docker compose up.

services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - '${HANDBOOK_PORT:-4321}:3000'
    volumes:
      # The working tree, so edits reload live.
      - .:/app
      # Two things must not be shared with the host:
      #   node_modules  - Linux-built in here, macOS-built out there.
      #   .docusaurus   - generated modules embed absolute paths, so a host
      #                   build writes /Users/... into files the container
      #                   resolves at /app/... and compilation fails.
      # build/ is deliberately NOT masked: the dev server never writes it, and
      # mounting a volume there makes the directory un-removable from the
      # host, which breaks `npm run build` while the container is up.
      - node_modules:/app/node_modules
      - docusaurus_cache:/app/.docusaurus
    # Bind mounts don't forward filesystem events on macOS or Windows, so the
    # watcher has to poll for hot reload to work.
    command: npm start -- --host 0.0.0.0 --poll 1000
    stdin_open: true
    tty: true

  # Production build, served locally. Not started by default:
  #   docker compose --profile prod up serve
  serve:
    profiles: [prod]
    build:
      context: .
      target: serve
    ports:
      - '${HANDBOOK_SERVE_PORT:-4322}:3000'

volumes:
  node_modules:
  docusaurus_cache:
